name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  registry-url: "https://registry.npmjs.org"

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Check
              run: npm run check:ci

            - name: Test
              run: npm run test:cov

            - name: Bench
              run: npm run bench

    tests:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                node: [22, 24, 26]
        runs-on: ${{ matrix.os }}
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Install deps
              run: npm ci

            - name: Build
              run: npm run build

            - name: Test
              run: npm run test:cov
